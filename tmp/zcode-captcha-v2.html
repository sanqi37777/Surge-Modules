<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>ZCode 领取验证</title></head>
<body style="background:#111;color:#eee;font-family:sans-serif;padding:24px">
<h2 style="margin:0 0 8px">ZCode 1024 福利领取 · 人机验证</h2>
<div style="font-size:16px;line-height:1.6">
  <div>三七：请点下方「开始验证」按钮，然后按提示<b>拖动滑块</b>完成验证。</div>
  <div>验证通过后，请把下方凭证框里的<b>整串字符复制</b>发给助理（不要只截图，复制文本最稳），助理收到立刻提交领取。</div>
</div>
<div id="status" style="font-size:22px;margin:18px 0;color:#ffd75e">INIT</div>
<div id="detail" style="color:#f66"></div>
<div id="cap-holder" style="margin:12px 0"></div>
<button id="cap-btn" type="button" style="font-size:22px;padding:14px 36px;margin-top:8px;cursor:pointer">开始验证</button>
<div style="margin-top:20px;color:#888;font-size:13px">验证凭证（验证通过后出现，全选复制发给助理）：</div>
<pre id="param" style="white-space:pre-wrap;word-break:break-all;background:#222;padding:10px;max-width:900px"></pre>
<script>
window.AliyunCaptchaConfig = { region: "sgp", prefix: "no8xfe" };
function setStatus(s){ document.getElementById("status").textContent = s; }
function setDetail(s){ document.getElementById("detail").textContent = s || ""; }
function isLocalhost(){
  var h = location.hostname;
  return h === "127.0.0.1" || h === "localhost" || h === "[::1]";
}
function saveParam(p){
  document.getElementById("param").textContent = p;
  if (isLocalhost()) {
    fetch("/save", {method:"POST", body:p}).then(function(){ setStatus("SAVED len=" + p.length + "（已回传助理，可以回聊天了）"); }).catch(function(e){ setStatus("PASS len=" + p.length + "（回传失败，请把下方凭证复制发助理）"); setDetail(String(e)); });
  } else {
    setStatus("PASS len=" + p.length + "（验证通过！请把下方凭证框里的整串字符复制发给助理）");
  }
}
var s = document.createElement("script");
s.src = "https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js";
s.onload = function(){
  setStatus("验证已就绪，请点「开始验证」");
  try {
    window.initAliyunCaptcha({
      SceneId: "11xygtvd",
      mode: "popup",
      language: "zh-CN",
      element: "#cap-holder",
      button: "#cap-btn",
      getInstance: function(inst){
        if (inst && typeof inst.startTracelessVerification === "function") {
          inst.startTracelessVerification();
        }
      },
      success: function(param){
        var p = (typeof param === "string") ? param : (param && param.captchaVerifyParam);
        if (p) { setStatus("验证通过，正在处理…"); saveParam(p); } else { setStatus("验证通过但凭证为空，请重试"); }
      },
      fail: function(p){ setStatus("验证未通过，请再点「开始验证」重试"); setDetail(JSON.stringify(p).slice(0,200)); },
      onError: function(p){ setStatus("验证出错，请再点「开始验证」重试"); setDetail(JSON.stringify(p).slice(0,200)); }
    });
  } catch(e) { setStatus("初始化出错"); setDetail(String(e)); }
};
s.onerror = function(){ setStatus("验证组件加载失败，请刷新页面"); };
document.head.appendChild(s);
</script>
</body></html>
