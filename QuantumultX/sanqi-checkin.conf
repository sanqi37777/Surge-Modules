# 三七的签到脚本合集 — Quantumult X 版
# 来源：Surge 模块转 QX（PingMe / 蜂鸟签到 / 春风 / 贴吧 / IQOO签到 / IQOO兑换 / 蜂鸟话费红包）
# 用法：QX 里加两次这个链接——一次做「重写引用」（读 [rewrite_local] + [mitm]），一次做「定时任务引用」（读 [task_local]）
# 注意：QX 里一条重写只跑第一个匹配的脚本；IQOO 签到与兑换共用 bbs-api.iqoo.com 那个接口，这里只留签到那条抓，兑换定时任务会读同一份 iqoos_data，不用重复抓
# 蜂鸟话费红包那两个任务默认是关的（enabled=false），12 月 1 日 10 点场前再开；开之前把 argument 里的「请填手机号」换成你自己的手机号

[rewrite_local]
^https://api\.pingmeapp\.net/app/queryBalanceAndBonus url script-request-header https://raw.githubusercontent.com/sanqi37777/Surge-Modules/main/Scripts/pingme.js
^https://httpizza\.ele\.me/lpd_knight\. url script-request-header https://raw.githubusercontent.com/sanqi37777/Surge-Modules/main/Scripts/eleme_checkin_v2_qx.js
^https://c\.cfmoto\.com/jv/user/user_info url script-response-body https://raw.githubusercontent.com/leiyiyan/resource/main/script/cfmoto/cfmoto.js
^https?://(c\.tieba|tiebac)\.baidu\.com/c/s/login url script-request-header https://raw.githubusercontent.com/NobyDa/Script/master/BDTieBa-DailyBonus/TieBa.js
^https://bbs-api\.iqoo\.com/api/v3/user\?userId= url script-response-body https://gist.githubusercontent.com/Sliverkiss/bfc5527ad3ea8ac7b0820ca442442452/raw/iqoo.js
^https://n\.962699\.com/goldmall/ url script-request-header https://raw.githubusercontent.com/sanqi37777/Surge-Modules/main/Scripts/fengniao_mall_rush_qx.js

[task_local]
0 9 * * * https://raw.githubusercontent.com/sanqi37777/Surge-Modules/main/Scripts/pingme.js, tag=PingMe每日签到, enabled=true
10 6 * * * https://raw.githubusercontent.com/sanqi37777/Surge-Modules/main/Scripts/eleme_checkin_v2_qx.js, tag=蜂鸟每日签到, enabled=true
40 6 * * * https://raw.githubusercontent.com/sanqi37777/Surge-Modules/main/Scripts/eleme_checkin_v2_qx.js, tag=蜂鸟签到补签, argument=backup, enabled=true
0 7 * * * https://raw.githubusercontent.com/leiyiyan/resource/main/script/cfmoto/cfmoto.js, tag=春风摩托任务, enabled=true
40 8 * * * https://raw.githubusercontent.com/NobyDa/Script/master/BDTieBa-DailyBonus/TieBa.js, tag=百度贴吧签到, enabled=true
0 9 * * * https://gist.githubusercontent.com/Sliverkiss/bfc5527ad3ea8ac7b0820ca442442452/raw/iqoo.js, tag=IQOO社区任务, enabled=true
0 11 * * * https://raw.githubusercontent.com/sanqi37777/Surge-Modules/main/Scripts/IQOO_Exchange_qx.js, tag=IQOO社区定时兑换, argument=giftId=0&acc=-1&addressId=0&retry=5&interval=1200, enabled=false
0 10,14,20 * * * https://raw.githubusercontent.com/sanqi37777/Surge-Modules/main/Scripts/fengniao_mall_rush_qx.js, tag=蜂鸟商城话费红包, argument=请填手机号, enabled=false
59 9,13,19 * * * https://raw.githubusercontent.com/sanqi37777/Surge-Modules/main/Scripts/fengniao_mall_rush_qx.js, tag=蜂鸟商城预刷新, argument=refresh, enabled=false

[mitm]
hostname = api.pingmeapp.net, httpizza.ele.me, c.cfmoto.com, c.tieba.baidu.com, tiebac.baidu.com, tieba.baidu.com, bbs-api.iqoo.com, n.962699.com
