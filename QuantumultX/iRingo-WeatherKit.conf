#  iRingo: 🌤 WeatherKit — Quantumult X 版
# 来源：青稞 LoonKissSurge 镜像的 iRingo WeatherKit 完整脚本版 v3.0.9
#      （源文件：Surge/Official/🍟 Apple 天气增强.official.sgmodule）
#      上游：NSRingo/WeatherKit（response.bundle.js v3.0.9）
# 用途：解锁 Apple 天气全部数据类型（空气质量、未来一小时降水、天气数据与预警）
# 默认配置：彩云天气数据源（Weather.Provider=ColorfulClouds，NextHour.Provider=ColorfulClouds，
#           空气质量算法 EU_EAQI，和风主机 devapi.qweather.com，Token 均为空）
# 说明：QX 里脚本不读 $argument，上述默认值与脚本内置默认配置一致，无需另传参数；
#      如需改数据源或填 Token，须用 BoxJs 的 iRingo 配置（把 Storage 改为 PersistentStore）。
# 要求：iOS 18+；QX 里须已生成 MITM 证书并在 iOS 设置中信任，否则天气数据改不了。
# 注意：源文件里的 4 条 REJECT 规则（拦苹果统计/系留）未带入——QX 重写引用不含 [Rule]；
#      如需拦截，可在 QX 本地 [filter_local] 另加：
#        host, weather-analytics-events.apple.com, reject
#        host-suffix, tthr.apple.com, reject
#        host, tether.edge.apple, reject

[rewrite_local]
# 🌤 WeatherKit.api.v1.availability.response
^https?:\/\/weatherkit\.apple\.com\/api\/v1\/availability\/ url script-response-body https://github.com/NSRingo/WeatherKit/releases/download/v3.0.9/response.bundle.js
# 🌤 WeatherKit.api.v2.weather.response
^https?:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/ url script-response-body https://github.com/NSRingo/WeatherKit/releases/download/v3.0.9/response.bundle.js

[mitm]
hostname = weatherkit.apple.com
